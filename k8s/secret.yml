# Kubernetes Secret — stores sensitive values, base64-encoded
# IMPORTANT: Never commit real values here. We'll create this with kubectl directly.
# This file is a template — the real secret is created from the command line.
#
# To create it, run:
#   kubectl create secret generic groq-secret \
#     --from-literal=GROQ_API_KEY=gsk_YOUR_KEY_HERE
apiVersion: v1
kind: Secret
metadata:
  name: groq-secret
type: Opaque
# data values are base64-encoded — kubectl create secret handles this for you
