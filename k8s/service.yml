apiVersion: v1
kind: Service
metadata:
  name: java-llm-app-svc
spec:
  # NodePort exposes the service on a port of the cluster node
  # In production you'd use LoadBalancer (cloud) or an Ingress
  type: NodePort
  selector:
    app: java-llm-app             # routes traffic to pods with this label
  ports:
    - protocol: TCP
      port: 80                    # the Service's port (internal cluster traffic)
      targetPort: 8080            # the container's actual port
      nodePort: 30080             # fixed external port on the node (30000-32767)
