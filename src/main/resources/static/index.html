<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 16px 24px;
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }

    header h1 { font-size: 1rem; font-weight: 600; color: #fff; }
    header span { font-size: 0.75rem; color: #888; margin-left: 4px; }

    #chat-container {
      flex: 1;
      width: 100%;
      max-width: 800px;
      padding: 24px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .bubble-wrap.user { align-self: flex-end; align-items: flex-end; }
    .bubble-wrap.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble-wrap.user .bubble {
      background: #6366f1;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble-wrap.assistant .bubble {
      background: #1e2130;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
      border: 1px solid #2a2d3a;
    }

    .label {
      font-size: 0.7rem;
      color: #666;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
    }

    .typing span {
      width: 7px; height: 7px;
      background: #6366f1;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
    }

    #input-area {
      width: 100%;
      max-width: 800px;
      padding: 12px 16px 20px;
    }

    #input-row {
      display: flex;
      gap: 10px;
      background: #1e2130;
      border: 1px solid #2a2d3a;
      border-radius: 14px;
      padding: 10px 14px;
      align-items: flex-end;
    }

    #input-row:focus-within {
      border-color: #6366f1;
    }

    #message-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e0e0e0;
      font-size: 0.92rem;
      resize: none;
      max-height: 140px;
      line-height: 1.5;
    }

    #message-input::placeholder { color: #555; }

    #send-btn {
      background: #6366f1;
      border: none;
      border-radius: 9px;
      width: 36px; height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    #send-btn:hover { background: #4f46e5; }
    #send-btn:disabled { background: #2a2d3a; cursor: default; }

    #send-btn svg { width: 18px; height: 18px; fill: #fff; }

    #session-bar {
      font-size: 0.7rem;
      color: #555;
      text-align: center;
      margin-top: 6px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #444;
    }

    .empty-state svg { width: 48px; height: 48px; opacity: 0.3; }
    .empty-state p { font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>LLM Chat <span>powered by Groq</span></h1>
</header>

<div id="chat-container">
  <div class="empty-state" id="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
    </svg>
    <p>Send a message to start chatting</p>
  </div>
</div>

<div id="input-area">
  <div id="input-row">
    <textarea
      id="message-input"
      rows="1"
      placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
    ></textarea>
    <button id="send-btn" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div id="session-bar">Session: <span id="session-id-display"></span></div>
</div>

<script>
  const sessionId = "session-" + Math.random().toString(36).slice(2, 9);
  document.getElementById("session-id-display").textContent = sessionId;

  const chatContainer = document.getElementById("chat-container");
  const input = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");
  const emptyState = document.getElementById("empty-state");

  function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }

  input.addEventListener("input", autoResize);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener("click", sendMessage);

  function addBubble(role, text) {
    if (emptyState) emptyState.remove();
    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap " + role;
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = role === "user" ? "You" : "Assistant";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    chatContainer.appendChild(wrap);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return bubble;
  }

  function addTyping() {
    if (emptyState) emptyState.remove();
    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap assistant";
    wrap.id = "typing-indicator";
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "Assistant";
    const bubble = document.createElement("div");
    bubble.className = "bubble typing";
    bubble.innerHTML = "<span></span><span></span><span></span>";
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    chatContainer.appendChild(wrap);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return wrap;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    addBubble("user", text);
    const typingEl = addTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: text })
      });

      const data = await res.json();
      typingEl.remove();

      if (data.reply) {
        addBubble("assistant", data.reply);
      } else {
        addBubble("assistant", "⚠️ No reply received.");
      }
    } catch (err) {
      typingEl.remove();
      addBubble("assistant", "⚠️ Error: " + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
